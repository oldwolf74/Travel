<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>여행지</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="../index.html">Travel Booking</a>
    <nav class="nav-links">
      <a href="../index.html">홈</a>
      <a href="../html/destinations.html">여행지</a>
      <a href="../html/stays.html">숙소</a>
      <a href="../html/mypage.html">마이페이지</a>
      <a href="../html/login.html">로그인</a>
    </nav>
  </div>
</header>
<main class="section"><div class="container"><h1>여행지</h1><div id="list" class="grid"></div></div></main>
<script type="module">
import { fetchDestinations } from "../js/destinations.js";
const list=document.querySelector("#list");
const data=await fetchDestinations();
list.innerHTML=data.map(d=>`<article class="card"><div class="card-body"><h2>${d.name}</h2><p>${d.region}</p><p>${d.summary||""}</p><a class="btn" href="./destination-detail.html?id=${d.id}">상세보기</a></div></article>`).join("")||"<p>등록된 여행지가 없습니다.</p>";
</script>
<footer><div class="container">Travel Booking Starter</div></footer>
</body>
</html>
