<main class="section"><div class="container"><h1>예약</h1><form id="reservation-form">
<div class="form-group"><label>체크인</label><input type="date" name="checkIn" required></div>
<div class="form-group"><label>체크아웃</label><input type="date" name="checkOut" required></div>
<div class="form-group"><label>인원</label><input type="number" name="guests" min="1" value="1" required></div>
<div class="form-group"><label>객실 수</label><input type="number" name="rooms" min="1" value="1" required></div>
<div class="form-group"><label>예약자 이름</label><input type="text" name="guestName" required></div>
<div class="form-group"><label>연락처</label><input type="tel" name="guestPhone" required></div>
<button class="btn" type="submit">예약 신청</button>
</form></div></main>
<footer><div class="container">Travel Booking Starter</div></footer>
<script type="module" src="../js/reservation-page.js"></script>
